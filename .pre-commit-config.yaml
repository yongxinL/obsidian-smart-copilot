# Smart Copilot — pre-commit hooks
# Ruff lint + format. OpenAPI regeneration on route/service/model changes (D-12/D-13).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: regen-openapi
        name: Regenerate OpenAPI spec (D-12/D-13)
        entry: python scripts/regen_openapi.py
        language: system
        types: [python]
        files: ^server/app/(routes|services|models)/.*\.py$
        pass_filenames: false